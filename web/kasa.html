<style>
/* Layout: one-column phone app, summary first, fixed bottom tab bar, add-sheet from bottom */
:root{
  --bg:#f2effa; --surface:#ffffff; --ink:#151b3d; --muted:#5e6288; --line:#dcd6ee;
  --accent:#1e2a66; --accent-ink:#ffffff; --accent-soft:#e6e0f7;
  --rsd:#23807d; --eur:#a87a14; --rub:#b0385a;
  --ok:#2c7a52; --warn:#a96400; --warn-soft:#fbeedd; --bad:#b3261e; --bad-soft:#f9e1e3;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1230; --surface:#161c42; --ink:#ecebf8; --muted:#a6a8cc; --line:#2b3266;
  --accent:#c7bbf2; --accent-ink:#141a40; --accent-soft:#2b2f63;
  --rsd:#6fcdc7; --eur:#e3b75c; --rub:#f08eaa;
  --ok:#74cf9c; --warn:#f2b354; --warn-soft:#3b2f1c; --bad:#f48c86; --bad-soft:#40202a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1230; --surface:#161c42; --ink:#ecebf8; --muted:#a6a8cc; --line:#2b3266;
  --accent:#c7bbf2; --accent-ink:#141a40; --accent-soft:#2b2f63;
  --rsd:#6fcdc7; --eur:#e3b75c; --rub:#f08eaa;
  --ok:#74cf9c; --warn:#f2b354; --warn-soft:#3b2f1c; --bad:#f48c86; --bad-soft:#40202a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(140px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance}
h2{font-size:15px;letter-spacing:.01em}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
/* hero */
.hero{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.total{font-family:var(--f-display);font-size:clamp(30px,9vw,42px);font-weight:700;letter-spacing:-.02em;line-height:1.1;word-break:break-word}
.basepick{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.basepick button{border:0;background:none;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.basepick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rates{display:flex;flex-direction:column;gap:8px}
.rates-h{display:flex;justify-content:space-between;align-items:baseline}
.rate-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rate{display:flex;flex-direction:column;gap:3px;padding:12px 12px;min-width:0}
.rate+.rate{border-left:1px solid var(--line)}
.rate-k{font-size:12px;color:var(--muted);font-weight:600}
.rate-v{font-size:17px;font-weight:700;white-space:nowrap}
.trend{font-size:12px;font-weight:700;white-space:nowrap}
.trend.up{color:var(--accent)} .trend.down{color:var(--rub)} .trend.flat{color:var(--muted);font-weight:600}
.rate-v small{font-size:12px;font-weight:600;color:var(--muted)}
.themebtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:grid;place-items:center;padding:0}
.themebtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bill{display:flex;flex-direction:column;gap:10px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.bill:first-child{border-top:0}
.bill-top{display:flex;gap:12px;align-items:flex-start;min-width:0}
.bill .t{font-weight:600;overflow-wrap:anywhere}
.bill .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.bill .s b{color:var(--ink)}
.bill .pill{margin-top:2px}
.bill-act{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.billform{display:flex;flex-direction:column;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.onb{position:fixed;inset:0;z-index:35;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.onb-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
.cat{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:100%;margin-bottom:-7px;width:62px;height:40px;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cat svg{width:100%;height:100%;overflow:visible}
.cat .fur{fill:var(--accent);stroke:none}
.cat .tail{fill:none;stroke:var(--accent);stroke-width:3.4;stroke-linecap:round}
.cat .eye,.cat .paw{fill:none;stroke:var(--surface);stroke-width:1.2;stroke-linecap:round}
.cat .zz text{font:600 7px var(--f-body);fill:var(--muted)}
.cat .w{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;opacity:0}
.cat .kitty{transform-origin:25px 27px}
@media (prefers-reduced-motion:no-preference){
  .cat .body{transform-box:fill-box;transform-origin:center bottom;animation:breathe 3.6s ease-in-out infinite}
  .cat .zz text{animation:zz 4s ease-in-out infinite;opacity:0}
  .cat .zz text+text{animation-delay:2s}
  .cat.purring .kitty{animation:purr .12s linear infinite}
  .cat.purring .w1{animation:wave 1s ease-out infinite}
  .cat.purring .w2{animation:wave 1s ease-out .18s infinite}
  .cat.purring .w3{animation:wave 1s ease-out .36s infinite}
  .cat.purring .zz{display:none}
}
.cat.purring .w{opacity:.8}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.07)}}
@keyframes zz{0%{opacity:0;transform:translate(0,4px)}30%{opacity:.9}70%{opacity:.6}100%{opacity:0;transform:translate(3px,-5px)}}
@keyframes purr{0%,100%{transform:translateX(0)}50%{transform:translateX(.45px)}}
@keyframes wave{0%{opacity:0}25%{opacity:.85}100%{opacity:0}}
.onb .card{gap:14px}
.onb .seg button{padding-block:10px}
input[type="date"].input{min-height:46px;-webkit-appearance:none;appearance:none;text-align:left}
/* wallets */
.wallets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wallet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px;display:flex;flex-direction:column;gap:4px;min-width:0;border-top:3px solid var(--c)}
.wallet .amt{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.wallet .eq{font-size:12px;color:var(--muted)}
.cur-RSD{--c:var(--rsd)} .cur-EUR{--c:var(--eur)} .cur-RUB{--c:var(--rub)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--c)}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px;border:1px solid transparent}
.alert b{display:block;margin-bottom:2px}
.alert.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.alert.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.alert .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px}
.alert.warn .dot{background:var(--warn)} .alert.bad .dot{background:var(--bad)}
/* limit bar */
.bar{position:relative;height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--ok)}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.bar s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.45}
/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.ico{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.money{font-weight:700;white-space:nowrap;text-align:right}
.money.in,b.in{color:var(--ok)}
.daygrp{font-size:12px;color:var(--muted);font-weight:600;padding:14px 0 2px;text-transform:uppercase;letter-spacing:.06em}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 6px;font-weight:600;font-size:14px;min-width:0}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg.cur button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:13.5px}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.amountbig{font-family:var(--f-display);font-size:28px;font-weight:500;border:0;border-bottom:2px solid var(--line);background:none;border-radius:0;padding:6px 0;width:100%}
.amountbig:focus{border-color:var(--accent);outline:none}
.hint{font-size:13px;color:var(--muted)}
/* tabbar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:11.5px;font-weight:600;color:var(--muted);text-decoration:none}
.tabbar nav{align-items:start}
.tabbar a{text-align:center;line-height:1.15}
.tabbar a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar a[aria-current="page"]{color:var(--accent)}
.fab{justify-self:center;width:52px;height:52px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
/* sheet */
.scrim{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(128px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:18px 8px;color:var(--muted);font-size:14px}
.status{font-size:13px;color:var(--muted)}
</style>

<script>
(function(){
const CURS=["RSD","EUR","RUB"];
const SYM={RSD:"дин",EUR:"€",RUB:"₽"};

const EXP_CATS=["Продукты","Жильё","Коммуналка","Кредит","Транспорт","Кафе","Здоровье","Связь","Покупки","Развлечения","Документы","Другое"];

const DEF_SETTINGS={base:"RSD",limit:0,limitCur:"RSD",rsdMin:20000,rsdDays:7,opening:{RSD:0,EUR:0,RUB:0}};

function setTheme(v){themePref=v;try{localStorage.setItem("kasa-theme",v)}catch(e){}applyTheme();render()}
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const GEAR='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
const MOON='<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
// ---------- helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v??"").replace(/\s/g,"").replace(",","."));return isFinite(n)?n:NaN};
function fmt(a,cur,opts={}){const d=cur==="RSD"||Math.abs(a)>=10000?0:2;const s=new Intl.NumberFormat("ru-RU",{minimumFractionDigits:opts.min??0,maximumFractionDigits:d}).format(a);return cur==="EUR"?(a<0?"−€"+s.replace("-",""):"€"+s):s.replace("-","−")+" "+SYM[cur]}
function settings(){const s=S.settings||{};return Object.assign({},DEF_SETTINGS,s,{opening:Object.assign({},DEF_SETTINGS.opening,s.opening||{})})}
function rates(){const r=S.rates||{};return {EUR:1,RSD:num(r.RSD)||117.5,RUB:num(r.RUB)||90.46}}
function conv(a,from,to){const r=rates();return a/r[from]*r[to]}
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const monthKey=s=>s.slice(0,7);
function daysIn(y,m){return new Date(y,m+1,0).getDate()}
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
const MONTHS=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MONTHS_N=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
function human(s){const d=parseISO(s),t=parseISO(today());const diff=Math.round((d-t)/864e5);if(diff===0)return"Сегодня";if(diff===-1)return"Вчера";if(diff===1)return"Завтра";return d.getDate()+" "+MONTHS[d.getMonth()]+(d.getFullYear()!==t.getFullYear()?" "+d.getFullYear():"")}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
function initials(c){return (c||"?").slice(0,2)}

// ---------- calculations ----------
function balances(){const s=settings();const b={RSD:+s.opening.RSD||0,EUR:+s.opening.EUR||0,RUB:+s.opening.RUB||0};
  for(const t of S.tx){const a=+t.amount||0;
    if(t.type==="expense")b[t.currency]-=a;
    else if(t.type==="income")b[t.currency]+=a;
    else if(t.type==="exchange"){b[t.currency]-=a;b[t.toCurrency]+=(+t.toAmount||0)}}
  return b}
function debtLeft(d){let p=0;for(const t of S.tx)if(t.debtId===d.id)p+=conv(+t.amount||0,t.currency,d.currency);return Math.max(0,Math.round(((+d.amount||0)-p)*100)/100)}
function openDebts(){return S.debts.map(d=>Object.assign({},d,{left:debtLeft(d)})).filter(d=>d.left>0).sort((a,b)=>(a.created||"").localeCompare(b.created||""))}
function monthSpend(key,cur){let sum=0;for(const t of S.tx)if(t.type==="expense"&&!t.debtId&&monthKey(t.date)===key)sum+=conv(+t.amount||0,t.currency,cur);return sum}
function nextOccurrence(day,from){const d=from?parseISO(from):parseISO(today());let y=d.getFullYear(),m=d.getMonth();
  if(Math.min(day,daysIn(y,m))<d.getDate()){m++;if(m>11){m=0;y++}}return iso(new Date(y,m,Math.min(day,daysIn(y,m))))}
function prevKey(k){const [y,m]=k.split("-").map(Number);return m===1?(y-1)+"-12":y+"-"+pad(m-1)}
let billArm=null;
function expandRec(){const out=[];for(const r of S.rec){if(r.active===false)continue;
    if(r.kind==="income"&&Array.isArray(r.parts)&&r.parts.length)r.parts.forEach((p,i)=>out.push(Object.assign({},r,{id:r.id+"~"+i,baseId:r.id,day:+p.day||1,amount:+p.amount||0,start:p.start||r.start,partNo:r.parts.length>1?i+1:0})));
    else out.push(Object.assign({},r,{baseId:r.id,partNo:0}))}return out}
function billsThisMonth(){return occurrences().filter(x=>x.kind!=="income")}
function incomesThisMonth(){return occurrences().filter(x=>x.kind==="income")}
function occurrences(){const now=new Date(),y=now.getFullYear(),m=now.getMonth(),key=iso(now).slice(0,7),td=parseISO(today());
  return expandRec().map(r=>{const day=Math.min(+r.day||1,daysIn(y,m));
    const notYet=r.start&&key<r.start.slice(0,7); // first payment is in a later month: nothing due this month
    const due=notYet?r.start:iso(new Date(y,m,day));
    const paid=notYet?null:S.tx.find(t=>t.recurringId===r.id&&t.period===key);const diff=Math.round((parseISO(due)-td)/864e5);
    let st=paid?"paid":diff<0?"overdue":diff<=3?"soon":"later";
    const pk=prevKey(key);const prevTx=S.tx.find(t=>t.recurringId===r.id&&t.period===pk);
    const dk=due.slice(0,7);const sh=+r.share||1;const full=r.variable?(+((r.amounts||{})[dk])||0):(+r.amount||0);
    const amt=paid?Math.round(conv(+paid.amount||0,paid.currency,r.currency)*100)/100:Math.round(full*sh*100)/100;
    const last=prevTx?+prevTx.amount:r.variable&&(r.amounts||{})[pk]!=null?Math.round(r.amounts[pk]*sh*100)/100:null;
    return Object.assign({},r,{amount:amt,full,share:sh,due,paid,st,diff,last,notYet:!!notYet,period:dk})}).sort((a,b)=>a.due.localeCompare(b.due))}
function rsdForecast(){const b=balances().RSD;const s=settings();
  const since=new Date();since.setDate(since.getDate()-30);const sinceS=iso(since);
  let spent=0;for(const t of S.tx)if(t.type==="expense"&&t.currency==="RSD"&&!t.recurringId&&!t.debtId&&t.date>=sinceS)spent+=+t.amount||0;
  const first=S.tx.filter(t=>t.type==="expense"&&t.currency==="RSD").map(t=>t.date).sort()[0];
  let span=30;if(first){span=Math.max(7,Math.min(30,Math.round((parseISO(today())-parseISO(first))/864e5)+1))}
  const daily=spent/span;
  const debtRsd=openDebts().filter(d=>d.currency==="RSD").reduce((a,d)=>a+d.left,0);
  const unpaid=billsThisMonth().filter(x=>!x.paid&&!x.notYet&&x.currency==="RSD").reduce((a,x)=>a+(+x.amount||0),0)+debtRsd;
  const free=b-unpaid;const daysLeft=daily>0?Math.floor(free/daily):Infinity;
  const now=new Date();const rest=daysIn(now.getFullYear(),now.getMonth())-now.getDate()+1;
  const need=Math.max(0,Math.ceil(daily*rest+unpaid+s.rsdMin-b));
  return {b,daily,unpaid,free,daysLeft,need,low:(free<s.rsdMin)||(daysLeft<s.rsdDays)}}
function lastExchangeRate(){const ex=S.tx.filter(t=>t.type==="exchange").sort((a,b)=>(b.date+b.created).localeCompare(a.date+a.created));
  for(const t of ex){if(t.toCurrency==="RSD"&&t.amount>0)return {from:t.currency,rate:t.toAmount/t.amount,date:t.date}}return null}

      <div class="field"><label for="obRsdMin">Напомнить поменять валюту, когда динаров меньше</label><input class="input" id="obRsdMin" inputmode="decimal" value="20000"></div>

async function finishOnb(){const v=id=>num($("#"+id).value);const o={};for(const c of CURS){const x=v("ob"+c);o[c]=isFinite(x)?x:0}
  const rent=v("obRent"),rd=$("#obRentDate").value||firstOfNext(),ud=$("#obUtilDate").value||firstOfNext(),ua=v("obUtil");
  const lim=v("obLimit"),rmin=v("obRsdMin"),rentHalf=$("#obRentHalf").checked,utilHalf=$("#obUtilHalf").checked;
  const s1=v("obSal1"),sd1=$("#obSalDate1").value||firstOfNext(),split=$("#obSalSplit").checked,s2=v("obSal2"),sd2=$("#obSalDate2").value||firstOfNext();
  const sp=[{day:parseISO(sd1).getDate(),amount:s1>0?s1:0,start:sd1}];if(split)sp.push({day:parseISO(sd2).getDate(),amount:s2>0?s2:0,start:sd2});
  const now=new Date().toISOString();
  const rows=[];
  if(rent>0)rows.push(["rent",{name:"Аренда квартиры",amount:rent,share:rentHalf?0.5:1,variable:false,currency:onbRentCur,day:parseISO(rd).getDate(),start:rd,category:"Жильё",active:true,created:now}]);
  rows.push(["salary",{name:"Зарплата",kind:"income",currency:onbSalCur,category:"Зарплата",parts:sp,active:true,created:now}]);
  rows.push(["utilities",{name:"Коммуналка",amount:0,amounts:ua>0?{[ud.slice(0,7)]:ua}:{},share:utilHalf?0.5:1,variable:true,currency:onbUtilCur,day:parseISO(ud).getDate(),start:ud,category:"Коммуналка",active:true,created:now}]);
  try{const st=Object.assign({},settings(),{opening:o,limit:lim>0?lim:0,limitCur:onbLimitCur,rsdMin:isFinite(rmin)&&rmin>=0?rmin:20000,seeded:true,onboarded:true,salarySeeded:true});
    for(const [id,b] of rows)await db.doc("recurring/"+id).set(b);
    await db.doc("budget/settings").set(st);toast("Готово")}catch(e){toast("Не получилось сохранить, попробуйте ещё раз")}}
let salSeeding=false;
function seedSalary(){if(salSeeding||!db||!S.loaded.s||!S.loaded.c||!S.settings||S.settings.salarySeeded)return;salSeeding=true;
  const has=S.rec.some(r=>r.kind==="income");const now=new Date().toISOString();
  (async()=>{try{if(!has)await db.doc("recurring/salary").set({name:"Зарплата",kind:"income",currency:"RSD",category:"Зарплата",parts:[{day:1,amount:0,start:firstOfNext()}],active:true,created:now});
    await db.doc("budget/settings").update({salarySeeded:true})}catch(e){salSeeding=false}})()}
function render(){
  const ready=S.loaded.s&&S.loaded.r&&S.loaded.t&&S.loaded.c&&S.loaded.d;
  if(ready)$("#status").hidden=true;
  renderOverview();renderOps();renderBills();renderPrefs();renderOnb();seedSalary();
}
function trend(now,prev){prev=num(prev);if(!(prev>0))return"";const d=(now/prev-1)*100;
  if(Math.abs(d)<0.05)return`<span class="trend flat">= без изменений</span>`;
  return`<span class="trend ${d>0?"up":"down"}">${d>0?"▲":"▼"} ${Math.abs(d).toFixed(2).replace(".",",")}%</span>`}
const rf=v=>v.toLocaleString("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2});

      <div class="basepick" role="group" aria-label="Показать в валюте">${CURS.map(c=>`<button data-base="${c}" aria-pressed="${c===base}">${c}</button>`).join("")}</div><button class="themebtn" data-themetoggle="1" aria-label="${isDark()?"Включить дневной режим":"Включить ночной режим"}">${isDark()?SUN:MOON}</button></div></div>

  </div>

  <div class="wallets">${walletHTML(b,base)}</div>

  <div class="card">

    ${lim>0?`<div class="bar ${share>1?"bad":share>=.8?"warn":""}"><i style="width:${Math.min(100,share*100)}%"></i><s style="left:${pace*100}%" title="Сегодняшняя точка месяца"></s></div>
    <div class="row between small"><span><b>${fmt(spent,limCur)}</b> из ${fmt(lim,limCur)}</span><span class="muted">${spent<=lim?"осталось "+fmt(lim-spent,limCur):""}</span></div>
    <div class="hint">Вертикальная риска показывает, какая часть месяца уже прошла. Если полоса левее, вы идёте в темпе.</div>`

  </div>

    <div class="field"><label for="fNote">Комментарий</label><input class="input" id="fNote" maxlength="80" placeholder="${ex?"Обменник":"Maxi, Idea…"}"></div></div>
    <div class="hint" id="eqHint"></div>
    <button class="btn primary" type="submit" style="padding:12px">Записать</button>
  </form></div>`;
  setTimeout(()=>{const a=$("#fAmt");a&&a.focus()},50);updHints();
}
function updHints(){const a=num($("#fAmt")?.value);const h=$("#eqHint");if(!h)return;
  if(F.type==="exchange"){const to=num($("#fTo")?.value);const ex=$("#exHint");
    if(ex){if(a>0&&to>0){const real=to/a,off=conv(1,F.currency,F.toCurrency);const inv=real<1;const show=v=>(inv?1/v:v).toLocaleString("ru-RU",{maximumFractionDigits:2});const pair=inv?`1 ${F.toCurrency} = X ${F.currency}`:`1 ${F.currency} = X ${F.toCurrency}`;const loss=(1-real/off)*100;ex.textContent=`Ваш курс: ${pair.replace("X",show(real))}, официальный ${show(off)}. ${loss>0.05?`Потеря на обмене ${loss.toFixed(1).replace(".",",")}%.`:loss<-0.05?`Это лучше официального на ${(-loss).toFixed(1).replace(".",",")}%.`:""}`}else if(a>0){ex.textContent=`По официальному курсу это около ${fmt(conv(a,F.currency,F.toCurrency),F.toCurrency)}.`}else ex.textContent=""}
    h.textContent="";return}
  const s=settings();h.textContent=a>0&&F.currency!==s.base?`≈ ${fmt(conv(a,F.currency,s.base),s.base)}`:""}
async function saveTx(){
  const a=num($("#fAmt").value);if(!(a>0)){toast("Введите сумму больше нуля");return}
  const doc={type:F.type,amount:Math.round(a*100)/100,currency:F.currency,date:$("#fDate").value||today(),note:$("#fNote").value.trim(),created:new Date().toISOString()};
  if(F.type==="exchange"){const to=num($("#fTo").value);if(!(to>0)){toast("Введите, сколько получили");return}
    if(F.currency===F.toCurrency){toast("Выберите разные валюты для обмена");return}
    doc.toAmount=Math.round(to*100)/100;doc.toCurrency=F.toCurrency;doc.category="Обмен"}else doc.category=F.category;
  closeSheet();await write(()=>db.collection("tx").add(doc),"Записано")}
function closeSheet(){$("#sheetHost").innerHTML=""}

// ---------- writes ----------
async function write(fn,ok){if(!db){toast("Сохранение сейчас недоступно");return}
  try{await fn();ok&&toast(ok)}catch(e){
    if(e&&e.code==="unavailable"){try{await new Promise(r=>setTimeout(r,600+Math.random()*600));await fn();ok&&toast(ok);return}catch(e2){}}
    toast(e&&e.code==="quota_exceeded"?"Хранилище заполнено, удалите старые операции":"Не получилось сохранить, попробуйте ещё раз")}}
let settingsBusy=Promise.resolve();
function saveSettings(patch,ok){const next=Object.assign({},settings(),patch);settingsBusy=settingsBusy.then(()=>write(()=>db.doc("budget/settings").set(next),ok));}

// ---------- events ----------
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a");if(!t)return;const d=t.dataset;
  if(t.id==="fab"){openSheet();return}
  if(d.onbcur){if(d.onbcur==="rent")onbRentCur=d.c;else if(d.onbcur==="limit")onbLimitCur=d.c;else if(d.onbcur==="sal")onbSalCur=d.c;else onbUtilCur=d.c;t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t));return}
  if(d.catPet){t.classList.remove("purring");void t.offsetWidth;t.classList.add("purring");clearTimeout(window.__purr);window.__purr=setTimeout(()=>t.classList.remove("purring"),3500);return}
  if(d.gorates){if(location.hash!=="#prefs")location.hash="#prefs";setTimeout(()=>{const r=$("#rateF");r&&r.scrollIntoView({block:"start"})},60);return}
  if(d.themetoggle){setTheme(isDark()?"light":"dark");return}
  if(d.themeSet){setTheme(d.themeSet);return}
  if(t.id==="closeSheet"){closeSheet();return}
  if(d.base){viewBase=d.base;renderOverview();return}
  if(d.type){if(d.type==="exchange"&&F.type!=="exchange"){F.currency="EUR";F.toCurrency="RSD"}F.type=d.type;keepAndReopen();return}
  if(d.cur){F.currency=d.cur;if(F.type==="exchange"&&F.toCurrency===d.cur)F.toCurrency=CURS.find(c=>c!==d.cur);keepAndReopen();return}
  if(d.tocur){F.toCurrency=d.tocur;keepAndReopen();return}
  if(d.cat){F.category=d.cat;document.querySelectorAll("[data-cat]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cat===d.cat));return}
  if(d.filter){opsFilter=d.filter;renderOps();return}
  if(d.arm){delArm=d.arm;renderOps();return}
  if(d.del){const id=d.del;delArm=null;write(()=>db.doc("tx/"+id).delete(),"Удалено");return}
  if(d.billarm){billArm=d.billarm;render();const sec=document.querySelector("section:not([hidden])");setTimeout(()=>sec&&sec.querySelector('[name="amt"]')?.focus(),30);return}
  if(d.billcancel){billArm=null;render();return}
  if(d.pay){const r=occurrences().find(x=>x.id===d.pay);if(!r)return;const key=r.period;const inc=r.kind==="income";
    write(()=>db.collection("tx").add({type:inc?"income":"expense",amount:+r.amount,currency:r.currency,category:r.category||(inc?"Зарплата":"Другое"),note:r.name,date:today(),recurringId:r.id,period:key,created:new Date().toISOString()}),inc?`Получено: ${r.name}`:`Отмечено: ${r.name}`);return}
  if(d.scur){salCur=d.scur;document.querySelectorAll("[data-scur]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.scur===salCur));return}
  if(t.id==="incNew"){recEdit=null;incForm=true;salCur="RSD";renderBills();return}
  if(t.id==="salCancel"){incForm=false;recEdit=null;renderBills();return}
  if(d.dpay){debtArm=d.dpay;render();const sec2=document.querySelector("section:not([hidden])");setTimeout(()=>sec2&&sec2.querySelector("#dpF input")?.select(),30);return}
  if(d.dcancel){debtArm=null;render();return}
  if(d.ddel){if(debtArm!=="del:"+d.ddel){debtArm="del:"+d.ddel;t.textContent="Точно удалить?";return}debtArm=null;write(()=>db.doc("debts/"+d.ddel).delete(),"Долг удалён");return}
  if(t.id==="debtNew"){debtForm=true;renderBills();setTimeout(()=>$("#dName")?.focus(),30);return}
  if(t.id==="debtCancel"){debtForm=false;renderBills();return}
  if(d.dcur){debtCur=d.dcur;document.querySelectorAll("[data-dcur]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.dcur===debtCur));return}
  if(d.recedit){const r=S.rec.find(x=>x.id===d.recedit);if(!r)return;recEdit=r.id;recForm=false;incForm=false;recCur=r.currency||"RSD";salCur=r.currency||"RSD";if(location.hash!=="#bills")location.hash="#bills";renderBills();setTimeout(()=>$("#rAmt")?.focus(),30);return}
  if(t.id==="recNew"){recEdit=null;recCur="RSD";recForm=true;renderBills();setTimeout(()=>$("#rName")?.focus(),30);return}
  if(t.id==="recCancel"){recForm=false;recEdit=null;renderBills();return}
  if(d.rcur){recCur=d.rcur;document.querySelectorAll("[data-rcur]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.rcur===recCur));return}
  if(d.recoff){write(()=>db.doc("recurring/"+d.recoff).update({active:false}),"Платёж отключён");return}
  if(d.recon){write(()=>db.doc("recurring/"+d.recon).update({active:true}),"Платёж снова активен");return}
  if(d.recdel){write(()=>db.doc("recurring/"+d.recdel).delete(),"Платёж удалён");return}
});
function keepAndReopen(){const a=$("#fAmt")?.value,to=$("#fTo")?.value,n=$("#fNote")?.value,dt=$("#fDate")?.value;openSheet();if(a)$("#fAmt").value=a;if(to&&$("#fTo"))$("#fTo").value=to;if(n)$("#fNote").value=n;if(dt)$("#fDate").value=dt;updHints()}
document.addEventListener("change",e=>{if(e.target.id==="sSplit"){const g=$("#sPart2");if(g)g.hidden=!e.target.checked}
  if(e.target.id==="obSalSplit"){const g=$("#obSalPart2");if(g)g.hidden=!e.target.checked}});
document.addEventListener("input",e=>{if(e.target.id==="fAmt"||e.target.id==="fTo")updHints();
  if(e.target.name==="amt"&&e.target.dataset.share){const m=e.target.closest("form").querySelector("[data-mine]");if(m)m.textContent="Ваша половина: "+fmt((num(e.target.value)||0)*+e.target.dataset.share,e.target.dataset.cur)}});
document.addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target;
  if(f.id==="salF"){const name=$("#sName").value.trim()||"Зарплата";const a1=num($("#sAmt1").value),d1=parseInt($("#sDay1").value,10);
    const split=$("#sSplit").checked;const a2=num($("#sAmt2").value),d2=parseInt($("#sDay2").value,10);
    if(!(d1>=1&&d1<=31)||(split&&!(d2>=1&&d2<=31))){toast("Проверьте числа месяца");return}
    const old=f.dataset.id?S.rec.find(r=>r.id===f.dataset.id):null;const op=(old&&old.parts)||[];
    const mk=(day,amount,i)=>({day,amount:isFinite(amount)&&amount>0?amount:0,start:op[i]&&+op[i].day===day&&op[i].start?op[i].start:nextOccurrence(day)});
    const parts=[mk(d1,a1,0)];if(split)parts.push(mk(d2,a2,1));
    const body={name,kind:"income",currency:salCur,category:"Зарплата",parts};
    if(old){recEdit=null;write(()=>db.doc("recurring/"+old.id).update(body),"Доход изменён")}
    else{incForm=false;write(()=>db.collection("recurring").add(Object.assign(body,{active:true,created:new Date().toISOString()})),"Доход добавлен")}}
  else if(f.id==="onbF")finishOnb();
  else if(f.id==="txF")saveTx();
  else if(f.id==="balF"){const o={};for(const c of CURS){const v=num($("#op"+c).value);o[c]=isFinite(v)?v:0}saveSettings({opening:o},"Остатки сохранены")}
  else if(f.id==="limF"){const v=num($("#limA").value);saveSettings({limit:isFinite(v)&&v>0?v:0,limitCur:$("#limC").value,base:$("#baseC").value},"Сохранено");viewBase=null}
  else if(f.id==="rsdF"){const v=num($("#rsdMin").value),dd=parseInt($("#rsdDays").value,10);saveSettings({rsdMin:isFinite(v)?v:0,rsdDays:dd>0?dd:7},"Сохранено")}
  else if(f.id==="rateF"){const a=num($("#rRSD").value),b=num($("#rRUB").value);if(!(a>0&&b>0)){toast("Курсы должны быть больше нуля");return}
    const old=S.rates;const prev=old&&old.date&&old.date!==today()?{RSD:num(old.RSD),RUB:num(old.RUB),date:old.date}:(old&&old.prev)||null;
    const body={RSD:a,RUB:b,date:today(),source:"вручную"};if(prev)body.prev=prev;
    write(()=>db.doc("budget/rates").set(body),"Курсы сохранены")}
  else if(f.id==="billF"){const r=S.rec.find(x=>x.id===f.dataset.id);const a=num(f.querySelector('[name="amt"]').value)||0;if(!r)return;const bb=billsThisMonth().find(x=>x.id===r.id);const key=bb?bb.period:today().slice(0,7);
    const act=e.submitter&&e.submitter.value;billArm=null;
    const mine=Math.round(a*(+r.share||1)*100)/100;
    if(act==="pay"){if(!(a>0)){toast("Введите сумму больше нуля");return}
      write(async()=>{await db.doc("recurring/"+r.id).update({amounts:{[key]:a}});await db.collection("tx").add({type:"expense",amount:mine,currency:r.currency,category:r.category||"Другое",note:r.name,date:today(),recurringId:r.id,period:key,created:new Date().toISOString()})},`Отмечено: ${r.name}`)}
    else write(()=>db.doc("recurring/"+r.id).update({amounts:{[key]:a}}),"Сумма сохранена")}
  else if(f.id==="dpF"){const dd=S.debts.find(x=>x.id===f.dataset.id);const a=num(f.querySelector("input").value);if(!dd||!(a>0)){toast("Введите сумму больше нуля");return}
    debtArm=null;write(()=>db.collection("tx").add({type:"expense",amount:Math.round(a*100)/100,currency:dd.currency,category:"Долг",note:dd.name,date:today(),debtId:dd.id,created:new Date().toISOString()}),"Записано: "+dd.name)}
  else if(f.id==="debtF"){const name=$("#dName").value.trim(),a=num($("#dAmt").value);if(!name||!(a>0)){toast("Укажите, кому и сколько");return}
    debtForm=false;write(()=>db.collection("debts").add({name,amount:a,currency:debtCur,created:new Date().toISOString()}),"Долг добавлен")}
  else if(f.id==="recF"){const name=$("#rName").value.trim(),a=num($("#rAmt").value),day=parseInt($("#rDay").value,10);
    const vr=$("#rVar").checked;
    if(!name||!(vr||a>0)||!(day>=1&&day<=31)){toast("Проверьте название, сумму и число");return}
    const body={name,amount:vr?0:a,variable:vr,share:$("#rHalf").checked?0.5:1,currency:recCur,day,category:$("#rCat").value};
    if(f.dataset.id){const id=f.dataset.id;recEdit=null;write(()=>db.doc("recurring/"+id).update(body),"Платёж изменён")}
    else{recForm=false;write(()=>db.collection("recurring").add(Object.assign(body,{start:nextOccurrence(day),active:true,created:new Date().toISOString()})),"Платёж добавлен")}}
});

// ---------- routing ----------
function route(){const tab=(location.hash||"#overview").slice(1);const ok=["overview","ops","bills","prefs"].includes(tab)?tab:"overview";
  for(const v of ["overview","ops","bills","prefs"])$("#v-"+v).hidden=v!==ok;
  document.querySelectorAll(".tabbar a").forEach(a=>{if(a.dataset.tab===ok)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  delArm=null;render();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);

// ---------- data ----------
async function start(){
  route();
  const c=window.claude&&window.claude.use?window.claude:null;
  const raw=c?await c.use("db"):null;const user=c?await c.use("user"):null;const uid=user?await user.id():null;
  if(!raw||!uid){$("#status").textContent="Личное хранилище недоступно в этом просмотре, поэтому записи не сохранятся. Откройте страницу, войдя в свой аккаунт Claude.";return}
  // Every path lives in this viewer's private subtree: data/users/<id>/...  Nobody else, the page owner included, can read it.
  const ROOT="data/users/"+uid;const map=p=>p.startsWith("budget/")?ROOT+"/"+p.slice(7):ROOT+"/ledger/"+p;
  db={doc:p=>raw.doc(map(p)),collection:p=>raw.collection(map(p))};
  const timer=setTimeout(()=>{$("#status").hidden=false;$("#status").textContent="Данные пока не загрузились. Проверьте интернет, страница подтянет их сама."},10000);
  const done=()=>{if(S.loaded.s&&S.loaded.r&&S.loaded.t&&S.loaded.c&&S.loaded.d)clearTimeout(timer)};
  const err=e=>{clearTimeout(timer);$("#status").hidden=false;$("#status").textContent="Не удалось загрузить данные. Обновите страницу позже."};
  db.doc("budget/settings").onSnapshot(s=>{S.settings=s.exists?s.data():null;if(!s.metadata.fromCache)S.loaded.s=true;done();render()},err);
  db.doc("budget/rates").onSnapshot(s=>{S.rates=s.exists?s.data():null;if(!s.metadata.fromCache)S.loaded.r=true;done();render()},err);
  db.collection("tx").onSnapshot(q=>{S.tx=q.docs.map(d=>Object.assign({id:d.id},d.data()));if(!q.metadata.fromCache)S.loaded.t=true;done();render()},err);
  db.collection("debts").onSnapshot(q=>{S.debts=q.docs.map(d=>Object.assign({id:d.id},d.data()));if(!q.metadata.fromCache)S.loaded.d=true;done();render()},err);
  db.collection("recurring").onSnapshot(q=>{S.rec=q.docs.map(d=>Object.assign({id:d.id},d.data()));if(!q.metadata.fromCache)S.loaded.c=true;done();render()},err);
}
applyTheme();
start();
})();
</script>
